[package]
name = "studydock"
version = "0.1.0"
description = "StudyDock Windows desktop shell"
authors = ["Director-code-c"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
