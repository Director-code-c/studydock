<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6750a4" />
    <title>离线模式 | StudyDock</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --background: #faf9fd;
        --surface: #ffffff;
        --foreground: #29252f;
        --muted: #6f6878;
        --border: #e5e0eb;
        --brand: #6750a4;
        --brand-soft: #efeafd;
        --shadow: 0 18px 45px rgba(50, 35, 80, 0.1);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #15131a;
          --surface: #211e27;
          --foreground: #f2edf7;
          --muted: #c2bacb;
          --border: #403a48;
          --brand: #d0bcff;
          --brand-soft: #352d49;
          --shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
        }
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      main { width: min(100%, 760px); }
      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; color: var(--brand); font-weight: 700; letter-spacing: -0.02em; }
      .brand img { width: 38px; height: 38px; }
      .panel { padding: clamp(24px, 5vw, 44px); background: var(--surface); border: 1px solid var(--border); border-radius: 24px; box-shadow: var(--shadow); }
      .eyebrow { display: inline-flex; padding: 6px 11px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-size: 13px; font-weight: 700; }
      h1 { margin: 18px 0 10px; font-size: clamp(27px, 5vw, 38px); letter-spacing: -0.04em; }
      .intro { margin: 0; color: var(--muted); line-height: 1.7; }
      .sync { margin-top: 24px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 14px; color: var(--muted); font-size: 14px; }
      .sync strong { color: var(--foreground); }
      #courses { margin-top: 24px; display: grid; gap: 12px; }
      .course { padding: 16px 18px; border: 1px solid var(--border); border-radius: 16px; }
      .course-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .course-name { margin: 0; font-size: 16px; }
      .course-code { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
      .course-status { flex: 0 0 auto; padding: 3px 8px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-size: 12px; }
      .course-description { margin: 12px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
      .empty { padding: 20px; border: 1px dashed var(--border); border-radius: 16px; color: var(--muted); text-align: center; }
      .privacy { margin: 24px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
      @media (max-width: 520px) { body { padding: 16px; } .panel { border-radius: 18px; } .course-head { display: block; } .course-status { display: inline-block; margin-top: 10px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><img src="/icon-192.svg" alt="" />StudyDock</div>
      <section class="panel" aria-labelledby="title">
        <span class="eyebrow">离线模式</span>
        <h1 id="title">最近的课程资料</h1>
        <p class="intro">当前无法连接服务器，下面仅展示最近一次成功同步的课程快照。</p>
        <div id="sync" class="sync" role="status">正在读取本地快照…</div>
        <div id="courses" aria-live="polite"></div>
        <p class="privacy">数据仅供查看。离线页面不能验证服务器登录状态，也不支持创建、编辑、归档、恢复或删除课程。共享电脑上使用后应主动退出。</p>
      </section>
    </main>
    <script>
      (() => {
        const DB_NAME = "studydock-offline"
        const STORE_NAME = "courseSnapshots"
        const sync = document.getElementById("sync")
        const courses = document.getElementById("courses")

        function escapeHtml(value) {
          return String(value ?? "").replace(/[&<>'"]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[character])
        }

        function formatDate(value) {
          const date = new Date(value)
          return Number.isNaN(date.getTime()) ? "时间未知" : date.toLocaleString("zh-CN", { dateStyle: "medium", timeStyle: "short" })
        }

        function readSnapshot(userId) {
          return new Promise((resolve, reject) => {
            if (!window.indexedDB) return reject(new Error("IndexedDB unavailable"))
            const request = indexedDB.open(DB_NAME, 1)
            request.onerror = () => reject(request.error)
            request.onupgradeneeded = () => {
              if (!request.result.objectStoreNames.contains(STORE_NAME)) request.result.createObjectStore(STORE_NAME, { keyPath: "userId" })
            }
            request.onsuccess = () => {
              const database = request.result
              const read = database.transaction(STORE_NAME, "readonly").objectStore(STORE_NAME).get(userId)
              read.onsuccess = () => { resolve(read.result || null); database.close() }
              read.onerror = () => { reject(read.error); database.close() }
            }
          })
        }

        function render(snapshot) {
          sync.innerHTML = snapshot ? "最后同步：<strong>" + escapeHtml(formatDate(snapshot.syncedAt)) + "</strong>" : "没有找到可用的课程缓存。"
          if (!snapshot || !Array.isArray(snapshot.courses) || snapshot.courses.length === 0) {
            courses.innerHTML = '<div class="empty">暂无离线课程。联网打开课程页并成功加载后，这里会显示最近同步的只读快照。</div>'
            return
          }
          courses.innerHTML = snapshot.courses.map((course) => '<article class="course"><div class="course-head"><div><h2 class="course-name">' + escapeHtml(course.name) + '</h2>' + (course.code ? '<p class="course-code">' + escapeHtml(course.code) + '</p>' : '') + '</div>' + (course.archived ? '<span class="course-status">已归档</span>' : '') + '</div>' + (course.description ? '<p class="course-description">' + escapeHtml(course.description) + '</p>' : '') + '</article>').join("")
        }

        const currentUserId = localStorage.getItem("studydock-offline-user")
        if (!currentUserId) {
          sync.textContent = "无法读取当前用户的离线快照。请联网登录并打开课程页后再试。"
          courses.innerHTML = '<div class="empty">离线页面不能验证服务器登录状态，因此不会显示未绑定用户的缓存。</div>'
          return
        }
        readSnapshot(currentUserId).then(render).catch(() => {
          sync.textContent = "暂时无法读取本地课程缓存。"
          courses.innerHTML = '<div class="empty">本地离线数据读取失败，请联网后重新打开课程页。</div>'
        })
      })()
    </script>
  </body>
</html>
